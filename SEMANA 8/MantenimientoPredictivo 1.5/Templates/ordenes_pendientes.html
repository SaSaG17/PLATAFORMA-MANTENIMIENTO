<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Órdenes de Trabajo Pendientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 Órdenes de Trabajo Asignadas</h2>
            <a href="{{ url_for('listar_ordenes') }}" class="btn btn-secondary">⬅️ Menú Principal</a>
        </div>
        <div class="card shadow-sm"><div class="card-body">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Título</th><th>Prioridad</th><th>Estado</th><th>Acción</th></tr>
                </thead>
                <tbody>
                    {% for o in ordenes %}
                    <tr>
                        <td>#{{ o.id }}</td>
                        <td><strong>{{ o.titulo }}</strong></td>
                        <td><span class="badge bg-warning text-dark">{{ o.prioridad }}</span></td>
                        <td><span class="badge bg-info">{{ o.estado }}</span></td>
                        <td>
                            <a href="{{ url_for('ejecutar_orden', orden_id=o.id) }}" class="btn btn-sm btn-success">⚙️ Tomar y Ejecutar</a>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center text-muted">No hay órdenes de trabajo pendientes.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div></div>
    </div>
</body>
</html>
