<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Editar' if repuesto else 'Registrar' }} Repuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4 text-center">📦 {{ 'Editar Repuesto' if repuesto else 'Registrar Nuevo Repuesto' }}</h3>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Código de Pieza:</label>
                        <input type="text" name="codigo_pieza" class="form-control" value="{{ repuesto.codigo_pieza if repuesto else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre del Repuesto:</label>
                        <input type="text" name="nombre_repuesto" class="form-control" value="{{ repuesto.nombre_repuesto if repuesto else '' }}" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Actual:</label>
                            <input type="number" name="stock_actual" class="form-control" value="{{ repuesto.stock_actual if repuesto else 0 }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Mínimo de Alerta:</label>
                            <input type="number" name="stock_minimo" class="form-control" value="{{ repuesto.stock_minimo if repuesto else 5 }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Costo Unitario ($):</label>
                        <input type="number" step="0.01" name="costo_unitario" class="form-control" value="{{ repuesto.costo_unitario if repuesto else 0.0 }}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('listar_repuestos') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">💾 Guardar Repuesto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
