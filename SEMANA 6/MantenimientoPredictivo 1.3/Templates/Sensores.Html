<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Sensores</title></head>
<body style="font-family:Arial; background:#f4f4f9; padding:20px; margin:0;">
    <div style="max-width:800px; margin:40px auto; background:white; padding:20px; border-radius:8px; box-shadow:0px 0px 10px rgba(0,0,0,0.1);">
        <a href="/" style="color:#007BFF; text-decoration:none; font-weight:bold;">&larr; Volver al Menú Principal</a>
        <h2>Monitoreo de Sensores Industriales</h2>
        <table border="1" style="width:100%; border-collapse:collapse; margin-top:15px;">
            <tr style="background:#007BFF; color:white;">
                <th style="padding:10px;">Código</th>
                <th style="padding:10px;">Equipo</th>
                <th style="padding:10px;">Variable</th>
                <th style="padding:10px;">Estado</th>
            </tr>
            {% for s in sensores %}
            <tr>
                <td style="padding:10px;">{{ s.codigo_sensor }}</td>
                <td style="padding:10px;">{{ s.nombre_equipo }}</td>
                <td style="padding:10px;">{{ s.tipo_variable }}</td>
                <td style="padding:10px;">{{ s.estado }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
