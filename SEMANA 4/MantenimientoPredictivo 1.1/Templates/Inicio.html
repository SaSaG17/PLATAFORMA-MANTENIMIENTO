<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú Principal - Mantenimiento Predictivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Bienvenido, {{ nombre }} (Rol: <strong>{{ rol }}</strong>)</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
    </nav>

    <div class="container text-center mt-5">
        <h1 class="mb-4">⚙️ Sistema de Mantenimiento Predictivo Industrial</h1>
        <p class="text-muted mb-4">Selecciona un módulo para comenzar:</p>

        <div class="d-flex justify-content-center flex-wrap gap-3">
            <!-- Módulo de Sensores -->
            <a href="{{ url_for('sensores') }}" class="btn btn-primary btn-lg">
                📊 Monitoreo de Sensores
            </a>

            <!-- Módulo de Órdenes de Trabajo (NUEVO) -->
            <a href="{{ url_for('listar_ordenes') }}" class="btn btn-warning btn-lg">
                📋 Órdenes de Trabajo
            </a>

            <!-- Módulo de Empleados (Solo visible si eres Administrador) -->
            {% if rol == 'administrador' %}
            <a href="{{ url_for('gestionar_usuarios') }}" class="btn btn-success btn-lg">
                👥 Gestión de Empleados
            </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
