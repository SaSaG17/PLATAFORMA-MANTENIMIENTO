<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Estado de Orden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-body p-4">
                <h4 class="mb-3">Actualizar Orden #{{ orden.id }}</h4>
                <p><strong>Título:</strong> {{ orden.titulo }}</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Cambiar Estado:</label>
                        <select name="estado" class="form-select">
                            <option value="pendiente" {% if orden.estado == 'pendiente' %}selected{% endif %}>Pendiente</option>
                            <option value="en_proceso" {% if orden.estado == 'en_proceso' %}selected{% endif %}>En Proceso</option>
                            <option value="completada" {% if orden.estado == 'completada' %}selected{% endif %}>Completada</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    <a href="{{ url_for('listar_ordenes') }}" class="btn btn-secondary w-100 mt-2">Volver</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
